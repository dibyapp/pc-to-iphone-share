name: Bug report
description: Report a reproducible problem without personal data
body:
  - type: markdown
    attributes:
      value: Do not include real passwords, keys, personal filenames, dashboard URLs, local configuration, or screenshots with sensitive data. Use synthetic examples. Security issues should use the private reporting channel once configured.
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system, processor architecture, and browser
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps using synthetic files
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
