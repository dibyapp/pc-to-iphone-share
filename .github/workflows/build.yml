name: Prepare unsigned artifacts (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Pre-release semantic version
        required: true
        default: 0.1.0-alpha.1
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build local archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/build_release.py --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pc-to-iphone-share-unsigned
          path: dist/*
          retention-days: 14
      # No hosted-release creation, pushes, website deployment, or auto-publishing.
