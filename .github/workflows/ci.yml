name: Validate source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Native runners for every packaged architecture.
        os: [windows-2025, windows-11-arm, macos-15-intel, macos-15, ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Detect data races on Linux x64
        if: matrix.os == 'ubuntu-24.04'
        run: go test -race -count=1 ./...
      - run: python scripts/test_privacy.py
      - run: python scripts/test_site.py
      - run: python scripts/test_smoke.py
      - run: python scripts/test_install.py
      - run: python scripts/smoke_binary.py --build
      - run: python scripts/privacy_check.py
